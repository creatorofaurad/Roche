[package]
name = "roche-rs"
version = "1.0.0"
edition = "2021"
authors = ["Charles <srijaan@proton.me>"]
description = "Rust FFI bindings for Roche bare-silicon EVM formal invariant verification and fuzzing engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/creatorofaurad/Roche"
readme = "README.md"
keywords = ["ethereum", "evm", "fuzzer", "formal-verification", "security"]
categories = ["cryptography::cryptocurrencies", "development-tools::testing"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
libc = "0.2"
hex = "0.4"
