[package]
name = "roche-rs"
version = "0.2.0"
edition = "2021"
authors = ["Charles <creatorofaurad>"]
description = "Native Rust bindings & Foundry plugin for Roche: Bare-Silicon EVM Trace Minimizer & Roche Limit Invariant Prover"
license = "MIT OR Apache-2.0"
repository = "https://github.com/creatorofaurad/roche"
keywords = ["ethereum", "evm", "fuzzing", "foundry", "security"]
categories = ["cryptography::cryptocurrencies", "development-tools::testing"]

[dependencies]
# Zero required external dependencies for core FFI bindings

[dev-dependencies]

[lib]
name = "roche_rs"
crate-type = ["rlib", "cdylib"]
