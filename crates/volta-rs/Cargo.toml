description = "Native Rust bindings & Foundry plugin for Volta: Bare-Silicon EVM Trace Minimizer & SMT Prover"
license = "MIT OR Apache-2.0"
repository = "https://github.com/creatorofaurad/volta"
keywords = ["ethereum", "evm", "fuzzing", "foundry", "security"]
